<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Amritha Sivakumar – UX/UI & Product Designer</title>
  <meta name="description"
    content="Portfolio of Amritha Sivakumar, UX/UI and Product Designer: UI screens, research-led case studies and resume.">
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #fff;
      --alt: #F6F5F3;
      --ink: #14171C;
      --muted: #555B65;
      --line: #E6E3DE;
      --accent: #C8420A;
      --accent-h: #A83508;
      --tag: #FDEBDD;
      --lite: #FF7A2F;
      --dark: #111317;
      --dmuted: #B9BEC7;
      --head: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
      --body: "Inter", "Segoe UI", system-ui, sans-serif;
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 72px)
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 400 17px/1.65 var(--body);
      -webkit-font-smoothing: antialiased
    }

    a {
      color: inherit
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 6px
    }

    .dark :focus-visible {
      outline-color: var(--lite)
    }

    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 24px
    }

    header {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 5;
      background: rgba(255, 255, 255, .94);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line)
    }

    header .wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 64px
    }

    .logo {
      display: flex;
      align-items: center;
      font: 700 18px var(--head);
      color: var(--ink);
      text-decoration: none
    }

    .logo span {
      color: var(--accent)
    }

    .mono {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: var(--accent);
      color: #fff;
      font: 800 14px var(--head)
    }

    nav {
      display: flex;
      gap: 28px;
      font-size: 15px;
      font-weight: 500
    }

    nav a {
      text-decoration: none;
      color: var(--muted)
    }

    nav a:hover {
      color: var(--ink)
    }

    h1,
    h2,
    h3 {
      font-family: var(--head);
      line-height: 1.1;
      margin: 0;
      letter-spacing: -.025em
    }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      background: var(--accent);
      color: #fff;
      border-radius: 99px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px
    }

    .btn:hover {
      background: var(--accent-h)
    }

    .btn.ghost {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--ink)
    }

    .btn.ghost:hover {
      background: var(--ink);
      color: #fff
    }

    .dark .btn {
      background: var(--lite);
      color: var(--ink)
    }

    .dark .btn:hover {
      background: #fff
    }

    .dark .btn.ghost {
      background: transparent;
      color: #fff;
      border-color: #5A606B
    }

    .dark .btn.ghost:hover {
      border-color: #fff;
      background: transparent
    }

    .btns {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 28px
    }

    .hero {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 48px;
      align-items: center;
      padding: 72px 0 88px
    }

    .hero h1 {
      font-size: clamp(40px, 6vw, 68px);
      font-weight: 800;
      letter-spacing: -.035em
    }

    .hero h1 span {
      color: var(--accent)
    }

    .hero p {
      max-width: 30em;
      color: var(--muted);
      font-size: 19px;
      margin: 22px 0 0
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 26px;
      padding: 6px 14px;
      border: 1px solid var(--line);
      border-radius: 99px;
      font-size: 14px;
      font-weight: 500;
      background: #fff
    }

    .chip i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent)
    }

    .photo {
      position: relative;
      justify-self: center;
      width: min(100%, 380px)
    }

    .circle {
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--ink);
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #fff;
      font: 800 clamp(64px, 12vw, 110px) var(--head)
    }

    .circle.has-photo {
      background: #fff
    }

    .circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block
    }

    .badge {
      position: absolute;
      right: -8px;
      bottom: 6%;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: grid;
      place-items: center;
      text-align: center;
      text-decoration: none;
      font: 700 16px/1.2 var(--head);
      border: 4px solid #fff
    }

    .badge:hover {
      background: var(--accent-h)
    }

    .sec {
      padding: 84px 0
    }

    .alt {
      background: var(--alt)
    }

    .dark {
      background: var(--dark);
      color: #F3F4F6
    }

    h2 {
      font-size: clamp(30px, 4vw, 40px);
      font-weight: 800;
      margin-bottom: 12px
    }

    .sub {
      color: var(--muted);
      margin: 0 0 36px;
      max-width: 36em
    }

    .label {
      color: var(--lite);
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 12px
    }

    .band {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 56px;
      align-items: center
    }

    .band q {
      display: block;
      font: 700 clamp(26px, 3.6vw, 38px)/1.25 var(--head);
      letter-spacing: -.02em;
      quotes: none
    }

    .hl {
      display: grid;
      gap: 12px
    }

    .hl div {
      border: 1px solid #2A2E36;
      border-radius: 14px;
      padding: 16px 20px;
      display: flex;
      align-items: baseline;
      gap: 14px
    }

    .hl b {
      font: 800 32px var(--head);
      color: var(--lite);
      min-width: 64px
    }

    .hl span {
      color: var(--dmuted);
      font-size: 15px
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 24px
    }

    .card {
      display: block;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      text-decoration: none
    }

    .card:hover {
      border-color: var(--accent)
    }

    .thumb {
      display: grid;
      place-items: center;
      min-height: 200px;
      background: var(--ink);
      font: 800 34px var(--head);
      color: var(--lite);
      text-align: center;
      padding: 16px;
      aspect-ratio: 16/9;
      overflow: hidden
    }

    .thumb img {
      width: 100%;
      height: 120%;
      object-fit: cover;
      object-position: center 30%;
      display: block
    }

    .thumb.has-image {
      padding: 0
    }

    .card .in {
      padding: 22px 24px 26px
    }

    .card h3 {
      font-size: 21px
    }

    .card p {
      margin: 8px 0 14px;
      color: var(--muted);
      font-size: 15.5px
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 0;
      margin: 0;
      list-style: none
    }

    .tags li {
      font-size: 13px;
      padding: 3px 11px;
      border-radius: 99px;
      background: var(--tag);
      color: var(--accent-h);
      font-weight: 600
    }

    .spec {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px
    }

    .spec h3 {
      font-size: 21px;
      margin-bottom: 8px
    }

    .spec p {
      margin: 0;
      color: var(--muted);
      font-size: 15.5px
    }

    .about {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 56px
    }

    .about p {
      margin: 0 0 16px;
      color: var(--muted)
    }

    .facts {
      background: var(--alt);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px
    }

    .facts h3 {
      font-size: 17px;
      margin-bottom: 10px
    }

    .facts ul {
      margin: 0 0 20px;
      padding-left: 18px;
      color: var(--muted)
    }

    .facts ul:last-child {
      margin: 0
    }

    .contact {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 56px;
      align-items: center
    }

    .contact h2 {
      color: #fff
    }

    .contact p {
      color: var(--dmuted);
      margin: 0 0 20px
    }

    .cl {
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-weight: 500
    }

    .cl a {
      color: var(--lite);
      text-decoration: none;
      width: fit-content
    }

    .cl a:hover {
      text-decoration: underline
    }

    .cta {
      border: 1px solid #2A2E36;
      border-radius: 18px;
      padding: 32px
    }

    .cta h3 {
      font-size: 26px;
      color: #fff;
      margin-bottom: 10px
    }

    .foot {
      border-top: 1px solid #2A2E36;
      margin-top: 56px;
      padding-top: 24px;
      color: var(--dmuted);
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px
    }

    .foot a {
      color: #fff;
      text-decoration: none;
      margin-left: 16px
    }

    .foot a:first-child {
      margin-left: 0
    }

    .back {
      display: inline-block;
      margin: 32px 0 8px;
      color: var(--muted);
      text-decoration: none;
      font-size: 15px;
      font-weight: 500
    }

    .back:hover {
      color: var(--ink)
    }

    .ch h1 {
      font-size: clamp(34px, 5vw, 52px);
      font-weight: 800
    }

    .ch .lead {
      font-size: 20px;
      color: var(--muted);
      margin: 16px 0 0
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin: 36px 0;
      padding: 22px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line)
    }

    .meta dt {
      font-size: 13px;
      color: var(--muted)
    }

    .meta dd {
      margin: 2px 0 0;
      font-weight: 600;
      font-size: 15px
    }

    .ph {
      display: grid;
      place-items: center;
      min-height: 300px;
      border-radius: 18px;
      background: var(--ink);
      font: 800 44px var(--head);
      color: var(--lite);
      text-align: center;
      padding: 20px
    }

    .ph small {
      display: block;
      font: 500 13px var(--body);
      color: var(--dmuted);
      margin-top: 8px
    }

    .case {
      display: grid;
      grid-template-columns: 170px 1fr;
      gap: 56px;
      padding: 52px 0
    }

    .side {
      position: sticky;
      top: calc(env(safe-area-inset-top, 0px) + 88px);
      align-self: start;
      display: flex;
      flex-direction: column;
      gap: 4px
    }

    .side button {
      all: unset;
      cursor: pointer;
      padding: 6px 0 6px 14px;
      border-left: 2px solid var(--line);
      color: var(--muted);
      font-size: 15px
    }

    .side button.on {
      border-color: var(--accent);
      color: var(--ink);
      font-weight: 600
    }

    .body section {
      padding: 0 0 52px
    }

    .body h2 {
      font-size: 26px;
      margin-bottom: 14px
    }

    .body p {
      max-width: 38em;
      margin: 0 0 14px
    }

    .body ul.l {
      max-width: 40em;
      padding-left: 20px;
      margin: 0 0 14px
    }

    .body ul.l li {
      margin-bottom: 8px
    }

    .body h3 {
      font-size: 18px;
      margin: 22px 0 8px
    }

    .steps {
      list-style: none;
      padding: 0;
      margin: 18px 0 0;
      counter-reset: s;
      border-left: 2px solid var(--line)
    }

    .steps li {
      counter-increment: s;
      position: relative;
      padding: 0 0 24px 28px
    }

    .steps li::before {
      content: counter(s);
      position: absolute;
      left: -13px;
      top: 0;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font: 600 13px/24px var(--body);
      text-align: center
    }

    .steps b {
      display: block;
      font: 700 19px var(--head);
      margin-bottom: 2px
    }

    .steps span {
      color: var(--muted);
      display: block;
      max-width: 36em
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 14px;
      margin: 18px 0
    }

    .stat {
      background: var(--alt);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px
    }

    .stat b {
      display: block;
      font: 800 30px var(--head);
      color: var(--accent)
    }

    .stat span {
      color: var(--muted);
      font-size: 14px
    }

    .note {
      font-size: 14px;
      color: var(--muted)
    }

    .next {
      display: block;
      padding: 36px 0;
      border-top: 1px solid var(--line);
      text-decoration: none
    }

    .next small {
      color: var(--muted);
      font-size: 14px
    }

    .next h3 {
      font-size: 28px;
      margin-top: 4px
    }

    .next:hover h3 {
      color: var(--accent)
    }

    @media (max-width:820px) {

      .hero,
      .band,
      .about,
      .contact {
        grid-template-columns: 1fr;
        gap: 36px
      }

      .hero {
        padding: 48px 0 64px
      }

      .sec {
        padding: 60px 0
      }

      .meta {
        grid-template-columns: 1fr 1fr
      }

      .case {
        grid-template-columns: 1fr;
        gap: 0
      }

      .side {
        display: none
      }

      nav {
        display: none
      }

      .badge {
        width: 96px;
        height: 96px;
        font-size: 14px
      }
    }

    @media (prefers-reduced-motion:reduce) {
      html {
        scroll-behavior: auto
      }
    }

    [hidden] {
      display: none !important
    }

    .gal {
      padding: 8px 0 24px
    }

    .ghead {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      margin: 40px 0 16px
    }

    .ghead h2 {
      font-size: 26px;
      margin: 0
    }

    .ghead p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 15px
    }

    .gctl {
      display: flex;
      gap: 8px
    }

    .gctl button {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      color: var(--ink)
    }

    .gctl button:hover {
      border-color: var(--accent);
      color: var(--accent)
    }

    .rail {
      display: flex;
      gap: 18px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding: 4px 2px 18px;
      -webkit-overflow-scrolling: touch
    }

    .shot {
      all: unset;
      box-sizing: border-box;
      flex: 0 0 auto;
      width: 210px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-snap-align: start;
      cursor: zoom-in
    }

    .shot.wide {
      width: 420px
    }

    .frame {
      display: block;
      aspect-ratio: 9/19;
      border-radius: 22px;
      border: 1px solid var(--line);
      background: var(--alt);
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(20, 23, 28, .16), 0 3px 8px rgba(20, 23, 28, .08)
    }

    .shot.wide .frame {
      aspect-ratio: 16/10;
      border-radius: 14px
    }

    .frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      display: block
    }

    .shot:hover .frame {
      border-color: var(--accent)
    }

    .shot:focus-visible .frame {
      outline: 2px solid var(--accent);
      outline-offset: 3px
    }

    .cap {
      font-size: 14px;
      color: var(--muted);
      font-weight: 500
    }

    .ph2 {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      text-align: center;
      padding: 16px;
      border: 2px dashed #CFC9C0;
      border-radius: inherit;
      background: var(--alt);
      color: var(--muted);
      font-size: 13.5px;
      font-weight: 500
    }

    .lb {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(17, 19, 23, .93);
      display: grid;
      place-items: center;
      padding: 24px
    }

    .lb figure {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      max-width: min(92vw, 1100px)
    }

    .lbimg img {
      max-height: 78vh;
      max-width: 100%;
      border-radius: 14px;
      display: block
    }

    .lbimg .ph2 {
      width: min(80vw, 340px);
      height: 70vh;
      border-color: #3A3F49;
      background: #1B1E24;
      color: var(--dmuted)
    }

    .lb figcaption {
      color: #fff;
      font-weight: 600;
      text-align: center
    }

    .lb figcaption small {
      display: block;
      color: var(--dmuted);
      font-weight: 400;
      margin-top: 2px
    }

    .lb button {
      position: absolute;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid #3A3F49;
      background: #1B1E24;
      color: #fff;
      font-size: 22px;
      line-height: 1;
      cursor: pointer
    }

    .lb button:hover {
      border-color: var(--lite)
    }

    .lbx {
      top: max(16px, env(safe-area-inset-top, 0px));
      right: 16px
    }

    .lbp {
      left: 16px;
      top: 50%
    }

    .lbn {
      right: 16px;
      top: 50%
    }

    @media (max-width:820px) {
      .shot {
        width: 170px
      }

      .shot.wide {
        width: 300px
      }

      .gctl {
        display: none
      }

      .lbp {
        left: 8px
      }

      .lbn {
        right: 8px
      }
    }

    .mark {
      width: 38px;
      height: 38px;
      display: block;
      flex: none
    }

    .ghead-title {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 12px
    }

    .ghead .prototype-link {
      padding: 0;
      margin: 0;
      font-size: 13px;
      background: transparent;
      color: var(--accent);
      border: 0
    }

    .ghead .prototype-link:hover {
      background: transparent;
      color: var(--accent-h);
      text-decoration: underline
    }
  </style>
</head>

<body>
  <header>
    <div class="wrap"><a class="logo" href="#/"><span>Amritha</span></a>
      <nav><a href="#/work">Work</a><a href="#/about">About</a><a href="#/contact">Contact</a><a id="rl" href="#/resume"
          target="_blank" rel="noopener">Resume</a></nav><a class="btn" href="#/contact">Contact me</a>
    </div>
  </header>
  <main id="app"></main>
  <div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="UI screen viewer" hidden><button type="button"
      class="lbx" aria-label="Close viewer">×</button><button type="button" class="lbp"
      aria-label="Previous screen">‹</button><button type="button" class="lbn" aria-label="Next screen">›</button>
    <figure>
      <div class="lbimg"></div>
      <figcaption></figcaption>
    </figure>
  </div>

  <script>
    /* ===== EDIT HERE: personal details and About page ===== */
    const ME = {
      name: "Amritha", role: "UX/UI & Product Designer", location: "Bengaluru, India", status: "Open to UI, UX and Product Design roles", photo: "Photo.png",
      headline: "I turn ambiguous problems into intuitive, high-impact digital products.",
      intro: "Blending user research, polished visual systems, and thoughtful AI features, I design accessible web and mobile experiences that genuinely help people.",
      email: "amrithasarjun@gmail.com", linkedin: "https://linkedin.com/in/amrithasivakumar", resume: "Amritha-Sivakumar-Resume.pdf",
      behance: "https://www.behance.net/amrithaaj",

      return `<section class="gal" id="screens" aria-label="UI screens"><div class="ghead"><div><div class="ghead-title"><h2>UI screens</h2>${figma ? `<a class="btn ghost prototype-link" href="${figma}" target="_blank" rel="noopener">View prototype in Figma</a>` : ""}</div><p>Key screens from the final design. Click any screen to enlarge.</p></div><div class="gctl"><button type="button" data-g="-1" aria-label="Scroll screens left">‹</button><button type="button" data-g="1" aria-label="Scroll screens right">›</button></div></div><div class="rail" tabindex="0" aria-label="UI screens carousel">${a.map((s, i) => `<button type="button" class="shot${s.wide ? " wide" : ""}" data-i="${i}" aria-label="Enlarge: ${s.cap}"><span class="frame"${s.ratio ? ` style="aspect-ratio:${s.ratio}"` : ""}>${s.src ? `<img src="${s.src}" alt="${s.cap}" loading="lazy" data-fb="shot">` : `<span class="ph2">Add screen image</span>`}</span><span class="cap">${s.cap}</span></button>`).join("")}</div></section>`
    };
    function home() {
      app.innerHTML = `<div class="wrap"><div class="hero"><div><h1>Hi, I'm ${ME.name}, <span>${ME.role}</span></h1><p>${ME.headline} ${ME.intro}</p><div class="chip"><i></i>${ME.status} · ${ME.location}</div><div class="btns"><a class="btn" href="#/work">View case studies</a></div></div>
 <div class="photo"><div class="circle${ME.photo ? " has-photo" : ""}">${ME.photo ? `<img src="${ME.photo}" alt="${ME.name}" data-fb="circle" data-t="${ini}">` : ini}</div><a class="badge" href="#/contact">Hire me ↓</a></div></div></div>
 <section class="sec dark"><div class="wrap band"><div><div class="label">My approach</div><q>${ME.approach}</q></div><div class="hl">${ME.highlights.map(h => `<div><b>${h[0]}</b><span>${h[1]}</span></div>`).join("")}</div></div></section>
 <section class="sec" id="work"><div class="wrap"><h2>Case studies</h2><p class="sub">Six projects, from research-led UX case studies to a design system study and an interactive prototype.</p><div class="grid">${P.map((p, i) => { const pv = p.preview || p.img; return `<a class="card" href="#/case/${i}"><div class="thumb${pv ? " has-image" : ""}">${pv ? `<img src="${pv}" alt="${p.title} preview" loading="lazy" data-fb="thumb" data-t="${p.id}">` : p.id}</div><div class="in"><h3>${p.title}</h3><p>${p.summary}</p><ul class="tags">${L(p.tags)}</ul></div></a>` }).join("")}</div></div></section>
 <section class="sec alt"><div class="wrap"><h2>What I do</h2><p class="sub">${ME.role}</p><div class="grid">${ME.specs.map(s => `<div class="spec"><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join("")}</div></div></section>
 <section class="sec" id="about"><div class="wrap"><h2>About me</h2><div class="about"><div>${ME.about.map(t => `<p>${t}</p>`).join("")}<div class="btns"><a class="btn" href="${ME.resume}" target="_blank" rel="noopener">View resume</a></div></div><div class="facts"><h3>Skills</h3><ul>${L(ME.skills)}</ul><h3>Tools</h3><ul>${L(ME.tools)}</ul><h3>Experience and education</h3><ul>${L(ME.experience)}</ul></div></div></div></section>
 <section class="sec dark" id="contact"><div class="wrap"><div class="contact"><div><h2>Contact me</h2><p>Let's talk.</p><div class="cl"><a href="mailto:${ME.email}">${ME.email}</a><a href="${ME.linkedin}" target="_blank" rel="noopener">LinkedIn</a>${ME.behance ? `<a href="${ME.behance}" target="_blank" rel="noopener">Behance</a>` : ""}</div></div><div class="cta"><h3>Have a role or project in mind?</h3><p>I'd love to hear about it. The quickest way to reach me is email.</p><a class="btn" href="mailto:${ME.email}">Send email</a></div></div>
 <div class="foot"><span>© ${new Date().getFullYear()} ${ME.name}</span><span><a href="${ME.linkedin}" target="_blank" rel="noopener">LinkedIn</a>${ME.behance ? `<a href="${ME.behance}" target="_blank" rel="noopener">Behance</a>` : ""}<a href="${ME.resume}" target="_blank" rel="noopener">Resume (PDF)</a></span></div></div></section>`;
      fixImgs(app);
    }
    function study(i) {
      const p = P[i]; if (!p) return home(); const n = P[(i + 1) % P.length]; curId = p.id; document.title = p.id + " | " + ME.name;
      app.innerHTML = `<div class="wrap"><a class="back" href="#/work">Back to all work</a>
 <div class="ch"><h1>${p.title}</h1><p class="lead">${p.summary}</p>
 <dl class="meta"><div><dt>Role</dt><dd>${p.role}</dd></div><div><dt>Project</dt><dd>${p.time}</dd></div><div><dt>Tools</dt><dd>${p.tools}</dd></div><div><dt>Type</dt><dd>${p.kind}</dd></div></dl>${vis(p, 1)}</div>
 ${gal(p.id, p.figma)}
 <div class="case"><div class="side">${["problem", "research", "process", "solution", "outcome"].map(s => `<button data-t="${s}">${s[0].toUpperCase() + s.slice(1)}</button>`).join("")}</div>
 <div class="body"><section id="problem"><h2>Problem</h2>${p.problem.map(t => `<p>${t}</p>`).join("")}</section>
 <section id="research"><h2>Research</h2><p>${p.research}</p><h3>Key insights</h3><ul class="l">${L(p.insights)}</ul></section>
 <section id="process"><h2>Process</h2><ol class="steps">${p.process.map(s => `<li><b>${s[0]}</b><span>${s[1]}</span></li>`).join("")}</ol></section>
 <section id="solution"><h2>Solution</h2><ul class="l">${L(p.solution)}</ul></section>
 <section id="outcome"><h2>Outcome</h2><div class="stats">${p.stats.map(s => `<div class="stat"><b>${s[0]}</b><span>${s[1]}</span></div>`).join("")}</div><p class="note">${p.note || "Course project. Starred figures are proxy estimates from prototype testing, not live product data."}</p>${p.worked && p.worked.length ? `<h3>${p.workedLabel || "What worked"}</h3><ul class="l">${L(p.worked)}</ul>` : ""}${p.improved && p.improved.length ? `<h3>${p.improvedLabel || "What I improved"}</h3><ul class="l">${L(p.improved)}</ul>` : ""}${p.figma ? `<p><a class="btn" href="${p.figma}" target="_blank" rel="noopener">View prototype in Figma</a></p>` : ""}</section></div></div>
 <a class="next" href="#/case/${(i + 1) % P.length}"><small>Next case study</small><h3>${n.id}</h3></a></div>`;
      fixImgs(app);
      const b = [...app.querySelectorAll(".side button")]; b.forEach(x => x.onclick = () => document.getElementById(x.dataset.t).scrollIntoView());
      const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) b.forEach(x => x.classList.toggle("on", x.dataset.t === e.target.id)) }), { rootMargin: "-30% 0px -60% 0px" });
      app.querySelectorAll(".body section").forEach(s => io.observe(s));
    }
    /* ---- screen viewer (lightbox) ---- */
    function showLB() {
      const s = cur[ci];
      lb.querySelector(".lbimg").innerHTML = s.src ? `<img src="${s.src}" alt="${s.cap}" data-fb="shot">` : `<span class="ph2">Add screen image</span>`;
      lb.querySelector("figcaption").innerHTML = `${s.cap}<small>${ci + 1} / ${cur.length}</small>`; fixImgs(lb)
    }
    function openLB() { lb.hidden = false; document.body.style.overflow = "hidden"; showLB(); lb.querySelector(".lbx").focus() }
    function closeLB() { if (lb.hidden) return; lb.hidden = true; document.body.style.overflow = ""; if (last) last.focus() }
    function step(d) { ci = (ci + cur.length + d) % cur.length; showLB() }
    app.addEventListener("click", e => {
      const g = e.target.closest("[data-g]"); if (g) { const r = app.querySelector(".rail"); r.scrollBy({ left: +g.dataset.g * r.clientWidth * .8, behavior: "smooth" }); return }
      const b = e.target.closest(".shot"); if (b) { last = b; cur = SCREENS[curId] || []; ci = +b.dataset.i; openLB() }
    });
    lb.addEventListener("click", e => { if (e.target === lb || e.target.closest(".lbx")) closeLB(); else if (e.target.closest(".lbp")) step(-1); else if (e.target.closest(".lbn")) step(1) });
    document.addEventListener("keydown", e => {
      if (lb.hidden) return;
      if (e.key === "Escape") closeLB(); else if (e.key === "ArrowLeft") step(-1); else if (e.key === "ArrowRight") step(1);
      else if (e.key === "Tab") {
        const f = [...lb.querySelectorAll("button")], a = document.activeElement;
        if (e.shiftKey && a === f[0]) { e.preventDefault(); f[f.length - 1].focus() } else if (!e.shiftKey && a === f[f.length - 1]) { e.preventDefault(); f[0].focus() }
      }
    });
    function route() {
      closeLB(); const h = location.hash.replace("#/", ""); document.title = ME.name + " – " + ME.role;
      const m = h.match(/^case\/(\d+)/);
      if (m) { study(+m[1]); scrollTo(0, 0); return }
      home(); if (["work", "about", "contact"].includes(h)) document.getElementById(h).scrollIntoView(); else scrollTo(0, 0);
    }
    addEventListener("hashchange", route); route();
  </script>
</body>

</html>
